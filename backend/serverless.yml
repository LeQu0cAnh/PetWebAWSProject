service: petweb-backend
frameworkVersion: '3'
useDotenv: true

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-southeast-1
  stage: ${opt:stage, 'prod'}
  
  # API Gateway CORS Configuration
  httpApi:
    cors:
      allowedOrigins:
        - http://localhost:5173
        - https://d37egyy2b131o6.cloudfront.net
        - https://pet.locle1010.dpdns.org
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowCredentials: true
  
  # Timeout & Memory
  timeout: 30
  memorySize: 512
  
  # Environment Variables — đọc từ Lambda Environment (set trên Console hoặc ở đây)
  environment:
    NODE_ENV: production
    DYNAMODB_TABLE: PetWeb
    COGNITO_REGION: ${env:COGNITO_REGION}
    COGNITO_USER_POOL_ID: ${env:COGNITO_USER_POOL_ID}
    COGNITO_CLIENT_ID: ${env:COGNITO_CLIENT_ID}
    FRONTEND_URL: ${env:FRONTEND_URL}
    AWS_S3_BUCKET: ${env:AWS_S3_BUCKET}
    AWS_S3_REGION: ${env:AWS_S3_REGION}
    GEMINI_API_KEY: ${env:GEMINI_API_KEY}

  # IAM Permissions
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: "*"
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:BatchGetItem
            - dynamodb:BatchWriteItem
            - dynamodb:DescribeTable
          Resource:
            - "arn:aws:dynamodb:ap-southeast-1:*:table/PetWeb"
            - "arn:aws:dynamodb:ap-southeast-1:*:table/PetWeb/index/*"
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
          Resource: "arn:aws:s3:::${env:AWS_S3_BUCKET, 'petweb-uploads'}/*"

functions:
  api:
    handler: lambda.handler
    description: PetWeb Backend API Handler
    events:
      # HTTP API (API Gateway v2) - rẻ hơn REST API v1
      - httpApi:
          path: /{proxy+}
          method: ANY
      - httpApi:
          path: /
          method: ANY

# Exclude không cần thiết để giảm kích thước deploy
package:
  patterns:
    - '!.env'
    - '!.env.*'
    - '!README.md'
    - '!**/*.test.js'
    - '!**/__tests__/**'
    - '!prisma/**'
    - '!scripts/**'

plugins:
  - serverless-dotenv-plugin

custom:
  dotenv:
    path: .env.production  # File env riêng cho production
